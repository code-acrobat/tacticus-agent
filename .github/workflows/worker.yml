# Deploys the Cloudflare Worker proxy (worker/) on every push that touches it.
# One-time repo setup: Settings -> Secrets and variables -> Actions
#   CLOUDFLARE_API_TOKEN   (token with "Edit Cloudflare Workers" on this account)
#   CLOUDFLARE_ACCOUNT_ID  (account home -> right sidebar)
# Worker *secrets* (LLM_KEY/LLM_MODEL/LLM_BASE_URL) are set once by hand with
# `npx wrangler secret put` — this workflow never rewrites them.
name: worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax check
        # .js is parsed as CommonJS; the worker is ESM (same trick check_page.py uses)
        run: cp worker/worker.js /tmp/worker.mjs && node --check /tmp/worker.mjs
      - name: Deploy (wrangler)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
