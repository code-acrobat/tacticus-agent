# Browser build: re-fetch gitignored research/ (pinned), make_bundle, deploy
# web/index.html + bundle + browser_harness.py to GitHub Pages.
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".
# Actions are SHA-pinned (release tag kept in the comment). Update one with:
#   gh api repos/actions/checkout/commits/v4.4.0 --jq .sha
# (the commits endpoint - the tag endpoint returns the annotated tag object).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # bump on every research sync (AGENTS.md "External data sync")
  PLANNER_SHA: 15fd7eb50f7eb6e8af9a51f6054d62ecf07d43f1
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Byte-compile every CLI
        run: python3 -m py_compile *.py
      - name: MCP adapter smoke (initialize handshake)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | python3 tacticus_mcp.py > /dev/null
      - name: Page + worker static checks
        run: python3 check_page.py
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch planner data (pinned)
        run: |
          mkdir -p research/tacticus-planner-api
          git -C research/tacticus-planner-api init -q
          git -C research/tacticus-planner-api fetch -q --depth 1 \
            https://github.com/TacticusPlanner/tacticus-planner-api "$PLANNER_SHA"
          git -C research/tacticus-planner-api checkout -q FETCH_HEAD
      - name: Fetch game config (pinned file)
        run: |
          mkdir -p research/datamine
          curl -fsSL -o research/datamine/gameconfig142.json \
            https://raw.githubusercontent.com/unrstuart/datamine_tacticus/73b9a64/gameconfig.1.42.json
      - run: python3 make_bundle.py
      - name: Assemble site
        run: |
          mkdir site
          cp web/index.html browser_harness.py dist/bundle.tar.gz site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
